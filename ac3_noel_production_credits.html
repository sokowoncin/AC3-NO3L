<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC3 NOEL — Production Credits</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0b0f;
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 560px; text-align: center; }
  .avatar {
    width: 92px; height: 92px; margin: 0 auto 16px;
    border-radius: 50%; display: grid; place-items: center;
    background: #fff; color: #0b0b0f;
    font-weight: 900; font-size: 25px; letter-spacing: -1px;
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  .tagline { margin: 8px 0 28px; color: #aaa; }
  .credits { text-align: left; display: grid; gap: 12px; }
  a.song {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 18px 20px; border-radius: 16px;
    background: #17171d; color: #fff; text-decoration: none;
    border: 1px solid #292931; transition: transform .2s, background .2s;
  }
  a.song:hover { transform: translateY(-2px); background: #202027; }
  .title { font-weight: 700; font-size: 16px; }
  .artist { color: #aaa; font-size: 13px; margin-top: 4px; }
  .arrow { font-size: 20px; color: #aaa; }
  footer { margin-top: 28px; color: #666; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="avatar">AC3</div>
  <h1>AC3 NOEL</h1>
  <p class="tagline">Music Producer • Sound Architect</p>

  <div class="credits">

      <div><div class="title">Refund, Pt. 1</div><div class="artist">Reeplay</div></div><div class="arrow">↗</div>
    </a>
    <a class="song" href="https://music.apple.com/ng/album/refund-part-2-feat-odumodublvck-ajebo-hustlers/1771210219?i=1771210220" target="_blank" rel="noopener">
      <div><div class="title">Refund, Pt. 2</div><div class="artist">Reeplay</div></div><div class="arrow">↗</div>
    </a>
    <a class="song" href="https://music.apple.com/ng/album/no-gree/1758897803?i=1758897811" target="_blank" rel="noopener">
      <div><div class="title">No Gree</div><div class="artist">Reeplay</div></div><div class="arrow">↗</div>
    </a>
    <a class="song" href="https://music.apple.com/ng/album/100ms/1780955026?i=1780955299" target="_blank" rel="noopener">
      <div><div class="title">100ms</div><div class="artist">TC Osborn</div></div><div class="arrow">↗</div>
    </a>
    <a class="song" href="https://music.apple.com/ng/album/inside-life/1757164413?i=1757164417" target="_blank" rel="noopener">
      <div><div class="title">Inside Life</div><div class="artist">H Berry</div></div><div class="arrow">↗</div>
    </a>
    <a class="song" href="https://music.apple.com/ng/album/different/1731755993?i=1731755994" target="_blank" rel="noopener">
      <div><div class="title">Different</div><div class="artist">Musa Wada</div></div><div class="arrow">↗</div>
    </a>
  </div>

  <footer>© AC3 NOEL • Production Credits</footer>
</div>

</html>
